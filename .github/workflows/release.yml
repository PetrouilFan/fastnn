# FastNN release
#
# FN3-20 (#66) changes here:
#   * tags may be prereleases (v3.0.0-alpha.1); the old regex rejected them;
#   * quality reuses tools/ci/cpu-lane.sh instead of a second hand-maintained
#     command list;
#   * portable-build uses --no-default-features: the 2.x feature list is deleted
#     by FN3-19 (#65) and no 3.0 feature is assumed;
#   * the wheel smoke is tools/ci/packaging_lane.py (outside-the-tree install),
#     which imports the fastnn.inference inference surface;
#   * the wheel smoke is STRICT: the pinned tiny-GPT-2 ONNX is fetched from the
#     URL and sha256 recorded in fixtures/parity/tiny-gpt2/model.lock.json, and
#     the lane fails by name if the model cannot be fetched or the pinned
#     inference does not pass. A release wheel is never accepted on import
#     alone.
#
# Nothing here is enabled by this change; it only alters the committed files.

name: Release

permissions:
  contents: write

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release tag from main (prereleases allowed)
        shell: bash
        run: |
          set -euo pipefail
          # SemVer prerelease suffixes such as -alpha.1 are valid 3.0 tags.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || {
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          }
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Verify package versions and changelog
        shell: bash
        run: |
          set -euo pipefail
          # Cargo writes 3.0.0-alpha.1, Python writes 3.0.0a1; the checker
          # normalises both and refuses any other location that drifted.
          python3 scripts/ci/check-versions.py --tag "$GITHUB_REF_NAME"

  quality:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run the CPU lane
        run: tools/ci/cpu-lane.sh

  portable-build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the portable (no-default-features) library
        run: cargo build --release --no-default-features

  build-wheels:
    needs: [quality, portable-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out target/ci-packaging/dist
          manylinux: auto
      - name: Fetch the pinned tiny-GPT-2 ONNX (documented URL + lock checksum)
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import sys
          import urllib.request

          lock = json.loads(
              pathlib.Path("fixtures/parity/tiny-gpt2/model.lock.json").read_text(encoding="utf-8")
          )
          entry = next(item for item in lock["files"] if item["path"] == "onnx/model.onnx")
          url = (
              f"https://huggingface.co/{lock['model_id']}/resolve/"
              f"{lock['revision']}/onnx/model.onnx"
          )
          target = pathlib.Path("tools/parity/.cache/models/tiny-gpt2/onnx/model.onnx")
          target.parent.mkdir(parents=True, exist_ok=True)
          print(f"fetching pinned model: {url}")
          try:
              urllib.request.urlretrieve(url, target)
          except Exception as error:
              print(
                  f"::error::pinned-model fetch failed: {error} (documented URL {url})",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          data = target.read_bytes()
          if len(data) != entry["bytes"]:
              print(
                  f"::error::pinned-model size mismatch: {len(data)} != {entry['bytes']} ({url})",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          actual = hashlib.sha256(data).hexdigest()
          if actual != entry["sha256"]:
              print(
                  f"::error::pinned-model sha256 mismatch: {actual} != {entry['sha256']}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"pinned model verified: {len(data)} bytes, sha256 {actual}")
      - name: Install and smoke-test the wheel outside the checkout (strict inference)
        env:
          FASTNN_FN3_ONNX_MODEL: ${{ github.workspace }}/tools/parity/.cache/models/tiny-gpt2/onnx/model.onnx
        run: python tools/ci/packaging_lane.py --skip-build --require-inference --out target/ci-packaging --job "release-wheel-${{ matrix.os }}"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/ci-packaging/dist/*.whl

  create-release:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.whl
