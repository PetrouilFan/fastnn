# FastNN CI — lane-based, 3.0 inference-only
#
# Every job maps to a named lane in tools/ci/lanes.json. The lane-summary job
# renders that inventory and fails if a lane that applies today is not PASSED.
# A lane that did not run is rendered NOT VERIFIED, never as success.
#
# Evidence boundaries, enforced by tools/ci/lane_status.py and
# tools/ci/verify_evidence.py:
#   cpu                     build/test, NO GPU
#   vulkan-build            SPIR-V + feature compile, NO DEVICE
#   vulkan-software-smoke   CI-ONLY lavapipe; NOT a GPU
#   packaging               wheel build/install smoke, NO GPU
#   pinned-model            stages the pinned revision, verifies it, runs it
#   gpu-physical            evidence validation only; hosted runners have NO GPU
#
# Removed under 3.0 (see docs/reports/fn3-20-ci-lanes.md):
#   * feature-profiles with simd/parallel/fusion/gpu — 2.x feature policy and
#     the wgpu backend (#65 deleted both);
#   * aarch64 with 2.x features — list needs redesigning for 3.0;
#   * coverage with 2.x features — same reason;
#   * --all-features / --features gpu, which cannot work after #65.
# None of those may be re-added without a lane entry and a baseline.

name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4
  LANE_STATUS_DIR: ${{ github.workspace }}/target/ci-lane-status

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-rust:
    name: "cpu / cpu-rust — build + tests, NO GPU"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run the CPU lane
        run: tools/ci/cpu-lane.sh
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  cpu-python:
    name: "cpu / cpu-python — pytest 'not slow', NO GPU"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Run the Python half of the CPU lane
        run: tools/ci/python-lane.sh
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  vulkan-build:
    name: "vulkan-build — SPIR-V + feature build, NO DEVICE"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools glslc
      - name: Run the Vulkan build lane (no device is created)
        run: tools/ci/vulkan-build-lane.sh
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  vulkan-software:
    name: "CI-ONLY vulkan-software-smoke — lavapipe, NOT a GPU"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe and Vulkan tools
        run: |
          sudo apt-get update
          # vulkan-validationlayers is required: the smoke opens the instance
          # with the validation layer enabled in code, and the runner image does
          # not ship VK_LAYER_KHRONOS_validation by default. Without it the
          # lane fails with "validation was requested but
          # VK_LAYER_KHRONOS_validation is not installed".
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1 vulkan-validationlayers
      - name: Run the CI-ONLY software Vulkan lane
        env:
          FN3_SOFTWARE_ICD: /usr/share/vulkan/icd.d/lvp_icd.json
        run: tools/ci/vulkan-software-lane.sh
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  packaging:
    name: "packaging / ${{ matrix.os }} — wheel install smoke, NO GPU"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: python -m pip install "maturin>=1.7,<2.0"
      - name: Test the packaging gate and its failure cases
        run: python -m unittest discover -s tools/ci -p test_packaging_lane.py
      - name: Build, install and smoke the wheel outside the source tree
        env:
          # CI has no pinned weights: name an absent path so not_run is explicit.
          FASTNN_FN3_ONNX_MODEL: ${{ runner.temp }}/fastnn-no-pinned-model.onnx
        run: python tools/ci/packaging_lane.py --job "packaging-${{ matrix.os }}"
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  pinned-model:
    name: "pinned-model — stage and run the pinned revision"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the pinned-model lane
        env:
          # The lane stages the graph from the revision the lock pins; cargo
          # itself stays offline. HF_HUB_OFFLINE must not be set here or the
          # fetch cannot reach the Hub, so the lane's fetch step unsets it.
          TRANSFORMERS_OFFLINE: "1"
        run: tools/ci/model-pin-lane.sh
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  gpu-evidence:
    name: "gpu-physical — evidence validation only (this runner has NO GPU)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed physical-GPU evidence; never run a GPU
        run: tools/ci/gpu-evidence-status.sh
      - name: Upload lane status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-status-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/target/ci-lane-status/*.json
          if-no-files-found: ignore

  lane-summary:
    name: "lane summary — honest evidence table"
    if: always()
    needs:
      - cpu-rust
      - cpu-python
      - vulkan-build
      - vulkan-software
      - packaging
      - pinned-model
      - gpu-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect lane status records
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lane-status-*
          path: ${{ github.workspace }}/target/ci-lane-status
          merge-multiple: true
      - name: Render the lane table and enforce the gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/lane_status.py render --status-dir "$LANE_STATUS_DIR" --needs-json "$NEEDS_JSON"
