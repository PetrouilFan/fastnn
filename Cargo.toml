[package]
name = "fastnn"
version = "2.6.0"
edition = "2021"
autobenches = false

[lib]
name = "fastnn"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3          = { version = "0.28", features = ["extension-module", "abi3-py311"], optional = true }
rayon         = { version = "1.8", optional = true }
smallvec      = { version = "1.11", features = ["union", "const_generics"] }
half          = "2.3"
bytemuck      = "1.14"
thiserror     = "1.0"
parking_lot   = "0.12"
dashmap       = "6"
serde         = { version = "1.0", features = ["derive", "rc"] }
serde_json    = "1.0"
bincode       = "1.3"
rand          = "0.8"
gemm          = { version = "0.19", default-features = false, features = ["std", "rayon"] }
core_affinity = "0.8"
raw-cpuid = "11.0"
wgpu         = { version = "24", optional = true }
pollster     = { version = "0.4", optional = true }
openblas-src = { version = "0.10", optional = true }
blas-src     = { version = "0.10", features = ["openblas"], optional = true }
fnv          = "1.0"
rustc-hash  = "2.0"
clap         = { version = "4", features = ["derive"], optional = true }
# FN3-11 (#57): raw Vulkan loader for the 3.0 Vulkan backend. Optional so a
# default build never touches the loader; enabled by `--features vulkan`.
ash          = { version = "0.38", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports"] }

[features]
default = ["simd", "parallel", "fusion-forward", "python", "prepared-plan"]
# FN3-11 (#57): the 3.0 Vulkan compute backend. Deliberately not in `default`:
# an enabled feature advertises a device that must be able to allocate and
# dispatch, so it is opt-in until the kernel owners land their shaders.
vulkan = ["dep:ash"]
python = ["dep:pyo3"]
gpu = ["dep:wgpu", "dep:pollster"]
openblas = ["blas-src/openblas-src"]
blas = []
parallel = ["rayon"]
simd = []
debug_canary = []
prepared-plan = []

# ── Fusion passes (compile-time modular) ─────────────────────────────
fusion-forward = [
  "fusion-op-relu",
  "fusion-op-gelu",
  "fusion-op-silu",
  "fusion-matmul-add-relu",
  "fusion-matmul-add-gelu",
  "fusion-matmul-add-silu",
  "fusion-residual-add-norm",
]
fusion-op-relu = []
fusion-op-gelu = []
fusion-op-silu = []
fusion-matmul-add-relu = []
fusion-matmul-add-gelu = []
fusion-matmul-add-silu = []
fusion-residual-add-norm = []
fusion-backward = []

# ── CLI binary ────────────────────────────────────────────────────────
cli = ["dep:clap"]

[[example]]
name = "gemm_bench"
path = "examples/gemm_bench.rs"

[[example]]
name = "packed_bench"
path = "benches/packed_bench.rs"

[[bin]]
name = "fastnn-runtime"
path = "src/bin/runtime.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true

[[bench]]
name = "cpu_baselines"
path = "benches/cpu_baselines.rs"
harness = false

# FN3-04 reproducible benchmark harness. Build with --no-default-features
# (the default `python` feature makes pyo3 an extension-module and breaks
# standalone binary linking); add simd/parallel/prepared-plan explicitly for
# measurements that should reflect the default CPU configuration.
[[bin]]
name = "fn3-bench"
path = "tools/bench/main.rs"

# FN3-17 (#63) inference CLI. Gated on the existing `cli` feature for the same
# reason as `fastnn-runtime`: a standalone binary is built without the default
# `python` feature, whose pyo3 extension-module mode is for shared libraries.
[[bin]]
name = "fn3-infer"
path = "src/bin/fn3-infer.rs"
required-features = ["cli"]

