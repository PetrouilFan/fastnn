[package]
name = "fastnn"
version = "3.0.0"
edition = "2021"
description = "Inference-only neural-network runtime: strict ONNX import, a target-aware planner, prepared-model artifacts, and CPU or Vulkan execution."
license = "MIT"
repository = "https://github.com/PetrouilFan/fastnn"
readme = "README.md"
keywords = ["neural-network", "inference", "onnx", "vulkan", "python-bindings"]
categories = ["science", "hardware-support"]
rust-version = "1.89"
include = [
  "/src/**",
  "/tools/perf/**",
  "/tools/cmake/**",
  "/build.rs",
  "/Cargo.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[lib]
name = "fastnn"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3        = { version = "0.28", features = ["extension-module", "abi3-py311"], optional = true }
rayon       = { version = "1.8", optional = true }
bytemuck    = "1.14"
# Memory-mapped prepared-model weights. A read-only artifact is mapped once and
# every session binds its weight slots to slices of that one mapping: this is
# the only way to share weights between sessions and across processes without
# copying them. Not optional: `Artifact::open` is part of the core reader.
memmap2     = "0.9"
# Raw Vulkan loader for the Vulkan backend. Optional so a default build never
# touches the loader; enabled by `--features vulkan`.
ash         = { version = "0.38", optional = true }
# oneDNN 3.14.1 source. Built as a static library by CMake when the
# `cpu-onednn` feature is on; the runtime declares its C API by hand in
# `src/fn3/backend/cpu/onednn/ffi.rs` and adds no other dependency.
onednn-src  = { version = "0.1.24", default-features = false, features = ["inference"], optional = true }

[dev-dependencies]
# Tests assert on JSON reports and fixture metadata; the library itself does not
# parse JSON.
serde_json = "1.0"

[features]
# A default build is a working CPU runtime with Python bindings. The Vulkan
# backend is opt-in because an enabled feature advertises a device that must be
# able to allocate and dispatch.
default = ["parallel", "python"]

# FastNN Python bindings (`fastnn._core`).
python = ["dep:pyo3"]
# Session-managed CPU worker pool.
parallel = ["dep:rayon"]
# The Vulkan compute backend.
vulkan = ["dep:ash"]
# The optional oneDNN CPU engine. Not in `default`: it adds a CMake-built
# static library (three minutes on a cold cache) and libstdc++.
cpu-onednn = ["dep:onednn-src"]
# Deterministic fault injection for the runtime-hardening matrix. Non-default
# and test-only: it adds no failure path unless a test arms one.
vulkan-fault-injection = ["vulkan"]
# Per-segment wall-clock accounting, for performance work only. Non-default and
# test-only: with it off no clock is read and `Session` has no timing field, so
# the feature costs exactly nothing in a shipped build.
segment-timing = []
fn3 = []
# The `fastnn-infer` CLI. Enables no dependency; the binary declares it.
cli = []

# The inference CLI is built without the `python` feature: PyO3's
# extension-module mode is for shared libraries, not standalone binaries.
[[bin]]
name = "fastnn-infer"
path = "src/bin/fastnn-infer.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true
