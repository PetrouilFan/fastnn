[package]
name = "fastnn"
version = "3.0.0"
edition = "2021"
autobenches = false
description = "Inference-only neural networks in Rust: ONNX decoder import, prepared-model artifacts, and CPU or Vulkan prefill/decode."
license = "MIT"
repository = "https://github.com/PetrouilFan/fastnn"
readme = "README.md"
keywords = ["neural-network", "inference", "onnx", "vulkan", "python-bindings"]
categories = ["science", "hardware-support"]
# Verified floor: cargo check passes with 1.89.0 for the default features,
# --no-default-features, --features cli,vulkan and the fn3-bench feature set;
# 1.88.0 rejects the AVX-512 intrinsics in the retained 2.x CPU kernels.
rust-version = "1.89"
# Ship the crate's own sources and the Rust targets declared below. Fixtures,
# models, docs, tests and the Python package are not part of the crate: the
# fixture trees alone are 2.1 MiB of numeric test data.
include = [
  "/src/**",
  "/benches/**",
  "/examples/**",
  "/tools/bench/**",
  "/Cargo.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[lib]
name = "fastnn"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3          = { version = "0.28", features = ["extension-module", "abi3-py311"], optional = true }
rayon         = { version = "1.8", optional = true }
smallvec      = { version = "1.11", features = ["union", "const_generics"] }
half          = "2.3"
bytemuck      = "1.14"
thiserror     = "1.0"
parking_lot   = "0.12"
dashmap       = "6"
serde         = { version = "1.0", features = ["derive", "rc"] }
serde_json    = "1.0"
bincode       = "1.3"
rand          = "0.8"
gemm          = { version = "0.19", default-features = false, features = ["std", "rayon"] }
core_affinity = "0.8"
raw-cpuid = "11.0"
openblas-src = { version = "0.10", optional = true }
blas-src     = { version = "0.10", features = ["openblas"], optional = true }
rustc-hash  = "2.0"
clap         = { version = "4", features = ["derive"], optional = true }
# FN3-11 (#57): raw Vulkan loader for the 3.0 Vulkan backend. Optional so a
# default build never touches the loader; enabled by `--features vulkan`.
ash          = { version = "0.38", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports"] }

[features]
# Inference defaults: SIMD/threaded CPU kernels, forward fusion, PyO3 bindings
# and the prepared-plan runtime.
default = ["simd", "parallel", "fusion-forward", "python", "prepared-plan"]

# The 3.0 Vulkan compute backend. Opt-in because an enabled feature advertises
# a device that must be able to allocate and dispatch; the four kernel families
# are registered and tested on a physical GTX 1080 Ti.
vulkan = ["dep:ash"]
# Deterministic fault injection for the FN3-27 (#73) runtime-hardening matrix.
# Non-default and test-only: it adds no failure path unless a test arms one, and
# it is compiled out of every shipped configuration.
vulkan-fault-injection = ["vulkan"]
# Links the real 3.0 prepared-model adapter into `fn3-bench` (FN3-21 / #67).
# Off by default: the adapter reads a model manifest and a 28 MB artifact, and a
# benchmark harness must not imply that it measured a model it was not given.
fn3 = []
# FastNN 3.0 Python bindings (`fastnn._core.inference`).
python = ["dep:pyo3"]
# CPU acceleration.
openblas = ["blas-src/openblas-src"]
blas = []
parallel = ["rayon"]
simd = []
# Extra runtime assertions in the CPU direct-convolution kernels.
debug_canary = []
# Prepared-plan construction and the persistent executor path.
prepared-plan = []

# ── Forward fusion passes (compile-time modular) ─────────────────────────────
fusion-forward = [
  "fusion-op-relu",
  "fusion-op-gelu",
  "fusion-op-silu",
  "fusion-matmul-add-relu",
  "fusion-matmul-add-gelu",
  "fusion-matmul-add-silu",
  "fusion-residual-add-norm",
]
fusion-op-relu = []
fusion-op-gelu = []
fusion-op-silu = []
fusion-matmul-add-relu = []
fusion-matmul-add-gelu = []
fusion-matmul-add-silu = []
fusion-residual-add-norm = []

# ── CLI binary ────────────────────────────────────────────────────────
cli = ["dep:clap"]

[[example]]
name = "gemm_bench"
path = "examples/gemm_bench.rs"

[[example]]
name = "packed_bench"
path = "benches/packed_bench.rs"

[[bin]]
name = "fastnn-runtime"
path = "src/bin/runtime.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true

[[bench]]
name = "cpu_baselines"
path = "benches/cpu_baselines.rs"
harness = false

# FN3-04 reproducible benchmark harness. Build with --no-default-features
# (the default `python` feature makes pyo3 an extension-module and breaks
# standalone binary linking); add simd/parallel/prepared-plan explicitly for
# measurements that should reflect the default CPU configuration.
[[bin]]
name = "fn3-bench"
path = "tools/bench/main.rs"

# FN3-17 (#63) inference CLI. Gated on the existing `cli` feature for the same
# reason as `fastnn-runtime`: a standalone binary is built without the default
# `python` feature, whose pyo3 extension-module mode is for shared libraries.
[[bin]]
name = "fastnn-infer"
path = "src/bin/fastnn-infer.rs"
required-features = ["cli"]
