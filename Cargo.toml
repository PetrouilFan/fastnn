[package]
name = "fastnn"
version = "3.0.0"
edition = "2021"
description = "Inference-only neural-network runtime: strict ONNX import, a target-aware planner, prepared-model artifacts, and CPU or Vulkan execution."
license = "MIT"
repository = "https://github.com/PetrouilFan/fastnn"
readme = "README.md"
keywords = ["neural-network", "inference", "onnx", "vulkan", "python-bindings"]
categories = ["science", "hardware-support"]
rust-version = "1.89"
include = [
  "/src/**",
  "/tools/perf/**",
  "/Cargo.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[lib]
name = "fastnn"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3        = { version = "0.28", features = ["extension-module", "abi3-py311"], optional = true }
rayon       = { version = "1.8", optional = true }
half        = "2.3"
bytemuck    = "1.14"
# The Python session object holds its inner state behind a parking_lot mutex so a
# second call from another thread cannot observe a half-updated session.
parking_lot = { version = "0.12", optional = true }
# Raw Vulkan loader for the Vulkan backend. Optional so a default build never
# touches the loader; enabled by `--features vulkan`.
ash         = { version = "0.38", optional = true }

[dev-dependencies]
# Tests assert on JSON reports and fixture metadata; the library itself does not
# parse JSON.
serde_json = "1.0"

[features]
# A default build is a working CPU runtime with Python bindings. The Vulkan
# backend is opt-in because an enabled feature advertises a device that must be
# able to allocate and dispatch.
default = ["parallel", "python"]

# FastNN Python bindings (`fastnn._core`).
python = ["dep:pyo3", "dep:parking_lot"]
# Session-managed CPU worker pool.
parallel = ["dep:rayon"]
# The Vulkan compute backend.
vulkan = ["dep:ash"]
# Deterministic fault injection for the runtime-hardening matrix. Non-default
# and test-only: it adds no failure path unless a test arms one.
vulkan-fault-injection = ["vulkan"]
fn3 = []
# The `fastnn-infer` CLI. Enables no dependency; the binary declares it.
cli = []

# The inference CLI is built without the `python` feature: PyO3's
# extension-module mode is for shared libraries, not standalone binaries.
[[bin]]
name = "fastnn-infer"
path = "src/bin/fastnn-infer.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
debug = false
strip = true
